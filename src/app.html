<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body>
		%sveltekit.body%

		<!--
			The only script on the site. Pages ship without the SvelteKit client
			runtime, so this marks the section being read in the contents rail and
			does nothing else. It exits immediately on pages without a rail.
		-->
		<script>
			(function () {
				var toc = document.querySelector('[data-toc]');
				if (!toc || !('IntersectionObserver' in window)) return;

				var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
				var sections = [];
				var owner = [];

				links.forEach(function (link, i) {
					var section = document.getElementById(decodeURIComponent(link.hash.slice(1)));
					if (section) {
						sections.push(section);
						owner.push(i);
					}
				});
				if (!sections.length) return;

				var observer = new IntersectionObserver(
					function (entries) {
						entries.forEach(function (entry) {
							if (!entry.isIntersecting) return;
							var active = owner[sections.indexOf(entry.target)];
							links.forEach(function (link, i) {
								if (i === active) link.setAttribute('aria-current', 'true');
								else link.removeAttribute('aria-current');
							});
						});
					},
					{ rootMargin: '-10% 0px -75% 0px' }
				);

				sections.forEach(function (section) {
					observer.observe(section);
				});
			})();
		</script>
	</body>
</html>
