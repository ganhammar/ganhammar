<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			The version is a cache key, not a build artefact. Cloudflare fronts the
			distribution and a deploy cannot purge it, so a replaced icon needs a
			new URL to be picked up. Bump it whenever favicon.svg changes.
		-->
		<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />

		<!--
			Runs before first paint, deliberately blocking, so a reader who chose a
			theme never sees the other one flash first. Absent a stored choice the
			page falls through to prefers-color-scheme, which needs no script.
		-->
		<script>
			(function () {
				var root = document.documentElement;
				root.dataset.js = '';
				try {
					var saved = localStorage.getItem('theme');
					if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
				} catch (error) {
					/* private mode, or storage disabled: fall back to the system */
				}
			})();
		</script>

		%sveltekit.head%
		<script src="https://app.ourfault.dev/browser/v1.js" data-key="pk_21f0cace510d6d5946c1d82e40f3b2c0" async></script>
	</head>
	<body>
		%sveltekit.body%

		<!--
			Pages ship without the SvelteKit client runtime, so every behaviour the
			site has lives in the inline scripts below: the theme switch, the image
			lightbox, the video autoplay fallback, the landing figure's idle
			animation and the contents rail. Each one exits immediately on a page
			that has nothing for it to do.
		-->
		<script>
			// The theme switch. The stored value wins over the system setting in
			// both directions; clearing it is not offered, since a reader who wants
			// the system back can simply pick the theme they are already on.
			(function () {
				var button = document.querySelector('[data-theme-toggle]');
				if (!button) return;

				var root = document.documentElement;
				var media = window.matchMedia('(prefers-color-scheme: dark)');

				function current() {
					return root.dataset.theme || (media.matches ? 'dark' : 'light');
				}

				function describe() {
					var next = current() === 'dark' ? 'light' : 'dark';
					button.setAttribute('aria-label', 'Switch to ' + next + ' theme');
					button.setAttribute('title', 'Switch to ' + next + ' theme');
				}

				describe();

				button.addEventListener('click', function () {
					var next = current() === 'dark' ? 'light' : 'dark';
					root.dataset.theme = next;
					try {
						localStorage.setItem('theme', next);
					} catch (error) {
						/* the choice just will not survive the visit */
					}
					describe();
				});

				media.addEventListener('change', describe);
			})();
		</script>

		<script>
			// Click an illustration to see it larger. A <dialog> rather than a
			// hand-built overlay: it traps focus, closes on Escape and restores
			// focus to the image on its own. Images are only marked as clickable
			// once this has run, so nothing offers an interaction that is absent.
			(function () {
				if (typeof HTMLDialogElement === 'undefined') return;

				var images = Array.prototype.filter.call(
					document.querySelectorAll('.prose img'),
					// Skip the GIF sitting inside a <video> as its fallback: it is in
					// the document but never rendered.
					function (image) {
						return !image.closest('video');
					}
				);
				if (!images.length) return;

				var dialog;
				var opener = null;

				function ensureDialog() {
					if (dialog) return dialog;

					dialog = document.createElement('dialog');
					dialog.className = 'lightbox';

					var close = document.createElement('button');
					close.type = 'button';
					close.className = 'lightbox-close';
					close.setAttribute('aria-label', 'Close');
					close.textContent = '×';

					var full = document.createElement('img');
					var caption = document.createElement('p');
					caption.className = 'lightbox-caption';

					dialog.append(close, full, caption);

					dialog.addEventListener('click', function (event) {
						// A click on the backdrop reports the dialog itself as target.
						if (event.target === dialog || event.target === close) dialog.close();
					});

					// A dialog only restores focus to whatever held it before, and a
					// clicked image never held it, so put it back explicitly. The
					// ring is governed by :focus-visible, so a mouse user sees none.
					dialog.addEventListener('close', function () {
						if (opener) opener.focus();
					});

					document.body.appendChild(dialog);
					return dialog;
				}

				function open(image) {
					opener = image;
					var box = ensureDialog();
					var full = box.querySelector('img');
					var caption = box.querySelector('.lightbox-caption');

					full.src = image.currentSrc || image.src;
					full.alt = image.alt || '';
					caption.textContent = image.alt || '';
					caption.hidden = !image.alt;

					box.showModal();
				}

				images.forEach(function (image) {
					image.classList.add('zoomable');
					image.tabIndex = 0;
					image.setAttribute('role', 'button');
					image.setAttribute('aria-label', (image.alt ? image.alt + ', ' : '') + 'view larger');

					image.addEventListener('click', function () {
						open(image);
					});

					image.addEventListener('keydown', function (event) {
						if (event.key === 'Enter' || event.key === ' ') {
							event.preventDefault();
							open(image);
						}
					});
				});
			})();
		</script>

		<script>
			// A GIF replaced by H.264 should behave like the GIF did. Autoplay can
			// still be refused: Low Power Mode, a data saver, or the reader asking
			// for less motion. In those cases it would sit on its poster frame with
			// no way to start it, so give it controls.
			(function () {
				var clips = document.querySelectorAll('video.motion');
				if (!clips.length) return;

				var still =
					window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

				Array.prototype.forEach.call(clips, function (clip) {
					if (still) {
						clip.autoplay = false;
						clip.removeAttribute('autoplay');
						clip.pause();
						clip.controls = true;
						return;
					}

					var attempt = clip.play();
					if (attempt && typeof attempt.catch === 'function') {
						attempt.catch(function () {
							clip.controls = true;
						});
					}
				});
			})();

			// The landing figure, played now and then while the reader stays on the
			// page. A request runs down the centreline, each plate drops onto the
			// next as it arrives, and once it reaches the bottom the stack springs
			// apart again. A run that falls due while the figure is off screen or
			// the tab is hidden is skipped, and nothing runs for a reader who asks
			// for less motion.
			(function () {
				var svg = document.querySelector('[data-assembly]');
				if (!svg || typeof svg.animate !== 'function') return;

				var FIRST_DELAY = 12000;
				var REPEAT_DELAY = 45000;
				var LEAD_IN = 250;
				var STEP = 560;
				var DROP = 340;
				var HOLD = 700;
				var EXPLODE = 1100;
				var SETTLE = 370;

				var calm = window.matchMedia('(prefers-reduced-motion: reduce)');
				var gap = Number(svg.dataset.gap);
				var fall = gap - Number(svg.dataset.thickness);

				function all(attribute) {
					var found = [];
					Array.prototype.forEach.call(svg.querySelectorAll('[' + attribute + ']'), function (el) {
						found[Number(el.getAttribute(attribute))] = el;
					});
					return found;
				}

				var plates = all('data-plate');
				var callouts = all('data-callout');
				var arrows = all('data-arrow');
				var numerals = all('data-numeral');
				var pulse = svg.querySelector('[data-pulse]');
				var last = plates.length - 1;

				// Every part runs on one clock, so keyframes are placed in
				// milliseconds and converted to offsets against the total.
				var arrive = [];
				for (var k = 0; k <= last; k++) arrive.push(LEAD_IN + k * STEP);
				var explode = arrive[last] + DROP + HOLD;
				var total = explode + EXPLODE + SETTLE;
				var at = function (ms) {
					return ms / total;
				};

				var dropIn = 'cubic-bezier(0.5, 0, 0.9, 0.5)';
				var springOut = 'cubic-bezier(0.3, 1.35, 0.6, 1)';
				var glide = 'cubic-bezier(0.45, 0, 0.55, 1)';

				function plateFrames(i) {
					var frames = [{ offset: 0, transform: 'translateY(0)' }];
					for (var k = i + 1; k <= last; k++) {
						frames.push({ offset: at(arrive[k]), transform: 'translateY(' + (k - 1 - i) * fall + 'px)', easing: dropIn });
						frames.push({ offset: at(arrive[k] + DROP), transform: 'translateY(' + (k - i) * fall + 'px)' });
					}
					frames.push({ offset: at(explode), transform: 'translateY(' + (last - i) * fall + 'px)', easing: springOut });
					frames.push({ offset: at(explode + EXPLODE), transform: 'translateY(0)' });
					frames.push({ offset: 1, transform: 'translateY(0)' });
					return frames;
				}

				// A callout and the arrow under its plate fade as the plate leaves
				// its drawn position, and return once the stack has come apart.
				function fadeFrames(i) {
					var leave = arrive[i + 1];
					return [
						{ offset: 0, opacity: 1 },
						{ offset: at(leave), opacity: 1 },
						{ offset: at(leave + DROP * 0.6), opacity: 0 },
						{ offset: at(explode + EXPLODE * 0.6), opacity: 0 },
						{ offset: at(explode + EXPLODE + SETTLE), opacity: 1 },
						{ offset: 1, opacity: 1 }
					];
				}

				function pulseFrames() {
					var frames = [{ offset: 0, opacity: 0, transform: 'translateY(0)' }];
					arrive.forEach(function (ms, k) {
						frames.push({ offset: at(ms), opacity: 1, transform: 'translateY(' + k * gap + 'px)', easing: glide });
					});
					frames.push({ offset: at(arrive[last] + DROP), opacity: 0, transform: 'translateY(' + last * gap + 'px)' });
					frames.push({ offset: 1, opacity: 0, transform: 'translateY(' + last * gap + 'px)' });
					return frames;
				}

				// A plate and its numeral turn red as the request reaches them, stay
				// red while the stack holds, and fade back as it comes apart.
				function markFrames(k, property, ink, accent) {
					var frame = function (offset, colour) {
						var f = { offset: offset };
						f[property] = colour;
						return f;
					};
					return [
						frame(0, ink),
						frame(at(arrive[k]), ink),
						frame(at(arrive[k] + 150), accent),
						frame(at(explode), accent),
						frame(at(explode + EXPLODE), ink),
						frame(1, ink)
					];
				}

				function play() {
					if (calm.matches) return Promise.resolve();

					var timing = { duration: total, easing: 'linear' };
					var accent = getComputedStyle(pulse).fill;
					var numeralInk = getComputedStyle(numerals[0]).fill;
					var edgeInk = getComputedStyle(plates[0].querySelector('polygon')).stroke;
					var runs = [pulse.animate(pulseFrames(), timing)];

					for (var i = 0; i < last; i++) {
						runs.push(plates[i].animate(plateFrames(i), timing));
						runs.push(callouts[i].animate(fadeFrames(i), timing));
						runs.push(arrows[i].animate(fadeFrames(i), timing));
					}
					numerals.forEach(function (numeral, k) {
						runs.push(numeral.animate(markFrames(k, 'fill', numeralInk, accent), timing));
					});
					plates.forEach(function (plate, k) {
						Array.prototype.forEach.call(plate.querySelectorAll('polygon'), function (face) {
							runs.push(face.animate(markFrames(k, 'stroke', edgeInk, accent), timing));
						});
					});

					return Promise.all(
						runs.map(function (run) {
							return run.finished;
						})
					).catch(function () {
						/* a cancelled run still lets the next one be scheduled */
					});
				}

				var inView = !('IntersectionObserver' in window);

				if (!inView) {
					new IntersectionObserver(function (entries) {
						inView = entries[entries.length - 1].isIntersecting;
					}).observe(svg);
				}

				// The next run is timed from the end of the last one.
				function schedule(delay) {
					setTimeout(function () {
						var run = inView && !document.hidden ? play() : Promise.resolve();
						run.then(function () {
							schedule(REPEAT_DELAY);
						});
					}, delay);
				}

				schedule(FIRST_DELAY);
			})();

			(function () {
				var toc = document.querySelector('[data-toc]');
				if (!toc || !('IntersectionObserver' in window)) return;

				var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
				var sections = [];
				var owner = [];

				links.forEach(function (link, i) {
					var section = document.getElementById(decodeURIComponent(link.hash.slice(1)));
					if (section) {
						sections.push(section);
						owner.push(i);
					}
				});
				if (!sections.length) return;

				var observer = new IntersectionObserver(
					function (entries) {
						entries.forEach(function (entry) {
							if (!entry.isIntersecting) return;
							var active = owner[sections.indexOf(entry.target)];
							links.forEach(function (link, i) {
								if (i === active) link.setAttribute('aria-current', 'true');
								else link.removeAttribute('aria-current');
							});
						});
					},
					{ rootMargin: '-10% 0px -75% 0px' }
				);

				sections.forEach(function (section) {
					observer.observe(section);
				});
			})();
		</script>
	</body>
</html>
