<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			The version is a cache key, not a build artefact. Cloudflare fronts the
			distribution and a deploy cannot purge it, so a replaced icon needs a
			new URL to be picked up. Bump it whenever favicon.svg changes.
		-->
		<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />

		<!--
			Runs before first paint, deliberately blocking, so a reader who chose a
			theme never sees the other one flash first. Absent a stored choice the
			page falls through to prefers-color-scheme, which needs no script.
		-->
		<script>
			(function () {
				var root = document.documentElement;
				root.dataset.js = '';
				try {
					var saved = localStorage.getItem('theme');
					if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
				} catch (error) {
					/* private mode, or storage disabled: fall back to the system */
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body>
		%sveltekit.body%

		<!--
			Pages ship without the SvelteKit client runtime, so every behaviour the
			site has lives in the inline scripts below: the theme switch, the image
			lightbox, the video autoplay fallback and the contents rail. Each one
			exits immediately on a page that has nothing for it to do.
		-->
		<script>
			// The theme switch. The stored value wins over the system setting in
			// both directions; clearing it is not offered, since a reader who wants
			// the system back can simply pick the theme they are already on.
			(function () {
				var button = document.querySelector('[data-theme-toggle]');
				if (!button) return;

				var root = document.documentElement;
				var media = window.matchMedia('(prefers-color-scheme: dark)');

				function current() {
					return root.dataset.theme || (media.matches ? 'dark' : 'light');
				}

				function describe() {
					var next = current() === 'dark' ? 'light' : 'dark';
					button.setAttribute('aria-label', 'Switch to ' + next + ' theme');
					button.setAttribute('title', 'Switch to ' + next + ' theme');
				}

				describe();

				button.addEventListener('click', function () {
					var next = current() === 'dark' ? 'light' : 'dark';
					root.dataset.theme = next;
					try {
						localStorage.setItem('theme', next);
					} catch (error) {
						/* the choice just will not survive the visit */
					}
					describe();
				});

				media.addEventListener('change', describe);
			})();
		</script>

		<script>
			// Click an illustration to see it larger. A <dialog> rather than a
			// hand-built overlay: it traps focus, closes on Escape and restores
			// focus to the image on its own. Images are only marked as clickable
			// once this has run, so nothing offers an interaction that is absent.
			(function () {
				if (typeof HTMLDialogElement === 'undefined') return;

				var images = Array.prototype.filter.call(
					document.querySelectorAll('.prose img'),
					// Skip the GIF sitting inside a <video> as its fallback: it is in
					// the document but never rendered.
					function (image) {
						return !image.closest('video');
					}
				);
				if (!images.length) return;

				var dialog;
				var opener = null;

				function ensureDialog() {
					if (dialog) return dialog;

					dialog = document.createElement('dialog');
					dialog.className = 'lightbox';

					var close = document.createElement('button');
					close.type = 'button';
					close.className = 'lightbox-close';
					close.setAttribute('aria-label', 'Close');
					close.textContent = '×';

					var full = document.createElement('img');
					var caption = document.createElement('p');
					caption.className = 'lightbox-caption';

					dialog.append(close, full, caption);

					dialog.addEventListener('click', function (event) {
						// A click on the backdrop reports the dialog itself as target.
						if (event.target === dialog || event.target === close) dialog.close();
					});

					// A dialog only restores focus to whatever held it before, and a
					// clicked image never held it, so put it back explicitly. The
					// ring is governed by :focus-visible, so a mouse user sees none.
					dialog.addEventListener('close', function () {
						if (opener) opener.focus();
					});

					document.body.appendChild(dialog);
					return dialog;
				}

				function open(image) {
					opener = image;
					var box = ensureDialog();
					var full = box.querySelector('img');
					var caption = box.querySelector('.lightbox-caption');

					full.src = image.currentSrc || image.src;
					full.alt = image.alt || '';
					caption.textContent = image.alt || '';
					caption.hidden = !image.alt;

					box.showModal();
				}

				images.forEach(function (image) {
					image.classList.add('zoomable');
					image.tabIndex = 0;
					image.setAttribute('role', 'button');
					image.setAttribute('aria-label', (image.alt ? image.alt + ', ' : '') + 'view larger');

					image.addEventListener('click', function () {
						open(image);
					});

					image.addEventListener('keydown', function (event) {
						if (event.key === 'Enter' || event.key === ' ') {
							event.preventDefault();
							open(image);
						}
					});
				});
			})();
		</script>

		<script>
			// A GIF replaced by H.264 should behave like the GIF did. Autoplay can
			// still be refused: Low Power Mode, a data saver, or the reader asking
			// for less motion. In those cases it would sit on its poster frame with
			// no way to start it, so give it controls.
			(function () {
				var clips = document.querySelectorAll('video.motion');
				if (!clips.length) return;

				var still =
					window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

				Array.prototype.forEach.call(clips, function (clip) {
					if (still) {
						clip.autoplay = false;
						clip.removeAttribute('autoplay');
						clip.pause();
						clip.controls = true;
						return;
					}

					var attempt = clip.play();
					if (attempt && typeof attempt.catch === 'function') {
						attempt.catch(function () {
							clip.controls = true;
						});
					}
				});
			})();

			(function () {
				var toc = document.querySelector('[data-toc]');
				if (!toc || !('IntersectionObserver' in window)) return;

				var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
				var sections = [];
				var owner = [];

				links.forEach(function (link, i) {
					var section = document.getElementById(decodeURIComponent(link.hash.slice(1)));
					if (section) {
						sections.push(section);
						owner.push(i);
					}
				});
				if (!sections.length) return;

				var observer = new IntersectionObserver(
					function (entries) {
						entries.forEach(function (entry) {
							if (!entry.isIntersecting) return;
							var active = owner[sections.indexOf(entry.target)];
							links.forEach(function (link, i) {
								if (i === active) link.setAttribute('aria-current', 'true');
								else link.removeAttribute('aria-current');
							});
						});
					},
					{ rootMargin: '-10% 0px -75% 0px' }
				);

				sections.forEach(function (section) {
					observer.observe(section);
				});
			})();
		</script>
	</body>
</html>
