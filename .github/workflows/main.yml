name: CI-CD

on:
  workflow_dispatch:
  push:
  # Posts live in ganhammar/ganhammar-posts and are baked in at build time, so
  # publishing there has to rebuild here. See docs/publishing.md for the
  # workflow that fires this.
  repository_dispatch:
    types: [posts-updated]
  # Safety net: if a dispatch is ever missed, the site still catches up daily.
  schedule:
    - cron: '17 5 * * *'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ secrets.DEPLOY_ROLE }}
          role-session-name: OIDCSession

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # Reads every post from the posts repo and prerenders the whole site.
      - name: Build
        run: npm run build
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: End-to-end test
        run: npm run test:e2e

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CI: true

      - name: Smoke test
        if: github.ref == 'refs/heads/main'
        run: npm run test:smoke
